# Render blueprint for the authoritative game server.
#
# The web application lives on Vercel and the combat server here: a persistent
# WebSocket connection cannot live in a serverless function, and the simulation
# has to keep running between two players' packets.
services:
  - type: web
    name: opfg-game-server
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --legacy-peer-deps && npm run build:packages && npm run build --workspace @opfg/server
    startCommand: npm run start --workspace @opfg/server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Comma-separated. Include the Vercel production domain and, if preview
      # deployments should be able to connect, a https://*.vercel.app entry.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: info
